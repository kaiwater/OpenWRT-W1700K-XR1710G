name: Build XR1710G firmware

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Config seed to use
        required: false
        default: configs/xr1710g-apps.seed
  push:
    branches: [ubi2]
    paths:
      - 'configs/**'
      - 'feeds.conf.default'
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # Make ccache survive toolchain rebuilds: hash compiler content instead of mtime,
      # and strip the workspace path so different runners share entries.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPRESS: true
      CCACHE_MAXSIZE: 2G
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      # Restore caches before any build work so the toolchain and every package
      # can use ccache / dl from the very first compile.
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('configs/xr1710g-apps.seed') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ hashFiles('configs/xr1710g-apps.seed') }}-
            ccache-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync unzip \
            zlib1g-dev file wget cpio bc libelf-dev libtool automake \
            pkg-config subversion swig time ccache

      - name: ccache init
        run: |
          ccache --version
          ccache -M 2G
          ccache -z

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cp "${{ github.event.inputs.seed || 'configs/xr1710g-apps.seed' }}" .config
          make defconfig
          grep -E '^CONFIG_(TARGET_DEVICE|DEVEL|CCACHE)=' .config

      - name: Download package sources
        run: make download -j"$(nproc)" || true

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" BUILD_LOG=1 2>&1 | tee build.log

      - name: Diagnose image build
        if: failure()
        run: |
          set +e
          {
            echo "=== make target/install V=s ==="
            make target/install V=s 2>&1 | tail -400
            echo
            echo "=== make -C target/linux install V=s ==="
            make -C target/linux install V=s 2>&1 | tail -200
            echo
            echo "=== disk ==="
            df -h
            echo
            echo "=== bin ==="
            find bin -maxdepth 4 -type f 2>/dev/null | head -50
          } > diagnostics.log 2>&1

      - name: Archive build logs
        if: always()
        run: tar czf logs.tar.gz logs 2>/dev/null || true

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .ccache
          key: ccache-${{ hashFiles('configs/xr1710g-apps.seed') }}-${{ github.run_id }}

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-firmware
          path: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.bin
            bin/targets/airoha/an7581/*.img.gz
            bin/targets/airoha/an7581/*.manifest
            bin/targets/airoha/an7581/sha256sums
            bin/targets/airoha/an7581/*.buildinfo
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            diagnostics.log
            logs.tar.gz
          if-no-files-found: ignore
          retention-days: 7
